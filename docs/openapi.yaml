openapi: 3.1.0
info:
  title: Sistema de Chamados — API REST
  version: 1.1.0
  description: >
    Contrato da API REST do Sistema de Chamados (help desk / service desk).
    Define autenticação (JWT) e autocadastro, perfis/departamentos, ciclo de
    vida completo dos chamados, comentários, anexos, avaliações, histórico,
    gestão de domínios (status/categoria/prioridade/SLA), usuários (admin e
    autoatendimento), notificações e métricas para dashboard. Este documento é
    reconciliado manualmente com os controllers reais (ASP.NET Core) a cada
    mudança relevante de contrato; o schema físico (PostgreSQL via EF Core)
    também os segue. Em ambiente de desenvolvimento, o próprio backend expõe
    um documento OpenAPI gerado (Swashbuckle) em `/swagger/v1/swagger.json` —
    útil para conferência ponto a ponto, mas sem as descrições de negócio em
    português mantidas aqui.
servers:
  - url: /api/v1
    description: Base path da API

tags:
  - name: Auth
    description: Autenticação, sessão e autocadastro de cliente
  - name: Chamados
    description: Ciclo de vida dos chamados, comentários, anexos, histórico e avaliações
  - name: Comentários
    description: Mensagens dentro de um chamado (endpoints do ChamadosController)
  - name: Anexos
    description: Arquivos anexados a um chamado ou a um comentário (endpoints do ChamadosController)
  - name: Histórico
    description: Trilha de auditoria do chamado (endpoint do ChamadosController)
  - name: Usuários
    description: Gestão de usuários (Administrador) e autoatendimento de perfil (qualquer usuário autenticado)
  - name: Departamentos
    description: Segmentação de técnicos por área de atendimento (Administrador)
  - name: Domínios
    description: Tabelas configuráveis — status, categorias, prioridades, SLA
  - name: Notificações
    description: Alertas do usuário autenticado (SLA, atribuição, mudança de status, avaliação etc.)
  - name: Métricas
    description: Indicadores agregados para o dashboard (Administrador e Técnico)

security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------- Auth
  /auth/login:
    post:
      tags: [Auth]
      summary: Autentica um usuário e retorna tokens JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /auth/registrar:
    post:
      tags: [Auth]
      summary: Autocadastro de um novo usuário com perfil Cliente
      description: >
        Único fluxo de criação de usuário sem exigir um Administrador — sempre
        cria o usuário com perfil Cliente. Já retorna tokens (mesmo formato de
        `/auth/login`), autenticando o usuário imediatamente após o cadastro.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrarClienteRequest' }
      responses:
        '201':
          description: Usuário criado e autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  # ---------------------------------------------------------------- Chamados
  /chamados:
    get:
      tags: [Chamados]
      summary: Lista chamados (com filtros e paginação)
      description: >
        O escopo é aplicado pelo perfil: Cliente vê apenas os próprios
        chamados; Administrador vê todos. Técnico do departamento HelpDesk
        tem visão ampla (todos os chamados, de qualquer departamento, para
        fazer a triagem inicial); técnico de outro departamento só vê os
        chamados cujo departamento responsável seja um dos departamentos aos
        quais pertence. Com `meus=true`, Técnico ou Administrador veem só os
        chamados assumidos por ele ou abertos por ele mesmo (substitui o
        escopo por departamento/perfil só nessa chamada).
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/Sort' }
        - name: idStatus
          in: query
          schema: { type: integer, format: int64 }
        - name: idCategoria
          in: query
          schema: { type: integer, format: int64 }
        - name: idPrioridade
          in: query
          schema: { type: integer, format: int64 }
        - name: idTecnico
          in: query
          schema: { type: integer, format: int64 }
        - name: idDepartamento
          in: query
          schema: { type: integer, format: int64 }
        - name: q
          in: query
          description: 'Busca textual em título/descrição (máx. 200 caracteres — 400 se exceder)'
          schema: { type: string, maxLength: 200 }
        - name: solicitante
          in: query
          description: 'Filtra por nome do solicitante, busca parcial case-insensitive (máx. 200 caracteres — 400 se exceder)'
          schema: { type: string, maxLength: 200 }
        - name: dataInicio
          in: query
          description: Filtra chamados criados a partir desta data/hora (inclusive)
          schema: { type: string, format: date-time }
        - name: dataFim
          in: query
          description: Filtra chamados criados até esta data/hora (inclusive)
          schema: { type: string, format: date-time }
        - name: situacaoSla
          in: query
          description: Filtra por situação de SLA de resposta OU resolução
          schema: { $ref: '#/components/schemas/SituacaoSla' }
        - name: meus
          in: query
          description: >
            Só para Técnico/Administrador: restringe aos chamados assumidos
            por ele ou abertos por ele mesmo. Ignorado para Cliente.
          schema: { type: boolean, default: false }
        - name: ocultarFinalizados
          in: query
          description: Quando true, exclui da listagem os chamados em status final.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Página de chamados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChamadoPage' }
        '400':
          description: Filtro `q` ou `solicitante` excede 200 caracteres
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Chamados]
      summary: Abre um novo chamado
      description: O solicitante é o usuário autenticado. Os prazos de SLA são calculados a partir da prioridade.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChamadoCreate' }
      responses:
        '201':
          description: Chamado criado
          headers:
            Location:
              description: URI do chamado criado
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Chamado' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /chamados/resumo-sla:
    get:
      tags: [Chamados]
      summary: Contagem de chamados abertos com SLA em risco/vencido
      description: >
        Alimenta os indicadores de alerta de SLA do dashboard. Considera
        apenas chamados não finalizados; o escopo respeita o perfil do
        usuário (igual ao `GET /chamados`).
      responses:
        '200':
          description: Contagem de chamados por situação de SLA
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumoSla' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /usuarios/tecnicos:
    get:
      tags: [Usuários]
      summary: Lista técnicos ativos
      description: >
        Endpoint enxuto (sem paginação) usado para popular seletores de
        técnico, como o filtro da listagem de chamados. Distinto do
        CRUD administrativo em `/usuarios`.
      responses:
        '200':
          description: Lista de técnicos ativos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Usuario' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /usuarios/atribuiveis:
    get:
      tags: [Usuários]
      summary: Lista usuários que podem receber atribuição de chamado
      description: >
        Endpoint enxuto (sem paginação), usado para popular o seletor de
        `/chamados/{id}/atribuir`. Sempre inclui os técnicos ativos; se o
        usuário autenticado for Administrador, também inclui os
        administradores ativos. Distinto do CRUD administrativo em
        `/usuarios`.
      parameters:
        - name: idDepartamento
          in: query
          description: >
            Filtra por técnicos do departamento informado. Só tem efeito para
            um Técnico que não pertença ao HelpDesk (que, como o
            Administrador, sempre vê todos os técnicos elegíveis).
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Lista de usuários atribuíveis
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Usuario' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /chamados/{id}:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    get:
      tags: [Chamados]
      summary: Detalha um chamado
      responses:
        '200':
          description: Chamado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Chamado' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Chamados]
      summary: Atualiza status, categoria ou prioridade do chamado
      description: >
        Usado para mudança de status e ajustes de categoria/prioridade.
        A atribuição de técnico é feita pelos endpoints dedicados
        `/atribuir` e `/assumir`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChamadoUpdate' }
      responses:
        '200':
          description: Chamado atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Chamado' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /chamados/{id}/conteudo:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    patch:
      tags: [Chamados]
      summary: Edita título e/ou descrição do chamado
      description: >
        Campos opcionais; só os enviados (não vazios) são alterados. Marca
        `conteudoEditado=true` na resposta. O Cliente solicitante não pode
        editar depois que o chamado está em status final (Resolvido/Fechado);
        Técnico/Administrador podem editar mesmo com o chamado finalizado.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChamadoConteudoUpdateRequest' }
      responses:
        '200':
          description: Conteúdo atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Chamado' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /chamados/{id}/ocultar-descricao:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    patch:
      tags: [Chamados]
      summary: Oculta ou reexibe a descrição do chamado (Administrador)
      description: >
        Usado para moderação de conteúdo impróprio na descrição original —
        marca `descricaoOculta` sem apagar o conteúdo.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChamadoOcultarDescricaoRequest' }
      responses:
        '200':
          description: Chamado atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Chamado' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /chamados/{id}/atribuir:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    post:
      tags: [Chamados]
      summary: Atribui o chamado a um técnico ou administrador
      description: >
        Administrador pode atribuir a qualquer momento; Técnico só pode
        atribuir um chamado ao qual já tem acesso (mesma regra de
        `GET /chamados/{id}`: técnico do HelpDesk, ou técnico do departamento
        responsável pelo chamado). O usuário alvo (`idTecnico`) precisa estar
        ativo; se o alvo tiver perfil Técnico, ele precisa pertencer ao
        departamento responsável pelo chamado (sem exceção para o HelpDesk);
        se quem atribui é Administrador, o alvo também pode ter perfil
        Administrador, sem restrição de departamento nesse caso. O chamado
        não pode estar em status final.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AtribuirTecnicoRequest' }
      responses:
        '200':
          description: Chamado atribuído
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Chamado' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /chamados/{id}/assumir:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    post:
      tags: [Chamados]
      summary: Técnico assume um chamado sem técnico atribuído
      description: >
        O técnico autenticado se autoatribui ao chamado. Exige pertencer ao
        departamento responsável pelo chamado (403 caso contrário, sem
        exceção para o HelpDesk). Falha com 409 se o chamado já tiver um
        técnico e com 422 se estiver em status final.
      responses:
        '200':
          description: Chamado assumido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Chamado' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /chamados/{id}/reabrir:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    post:
      tags: [Chamados]
      summary: Reabre um chamado finalizado
      description: >
        Reverte o chamado para o status inicial (Aberto), limpando
        `resolvidoEm`/`fechadoEm` e preservando o técnico atribuído. Pode
        reabrir quem tem acesso ao chamado (mesma regra de
        `GET /chamados/{id}`): o Cliente solicitante, o Técnico atribuído (ou
        qualquer técnico, se o chamado estiver sem técnico) ou um
        Administrador. Falha com 422 se o chamado não estiver em status
        final. Notifica os administradores e, se houver, o técnico atribuído
        (quando diferente de quem reabriu).
      responses:
        '200':
          description: Chamado reaberto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Chamado' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /chamados/{id}/encaminhar:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    post:
      tags: [Chamados]
      summary: Encaminha o chamado para outro departamento
      description: >
        Só Administrador ou Técnico do departamento HelpDesk pode encaminhar
        livremente entre departamentos (MVP: os demais departamentos só
        devolvem ao HelpDesk via `/devolver-helpdesk`). Ao encaminhar, o
        sistema define o status como "Aberto", remove o técnico responsável
        atual (se houver) e atualiza o departamento responsável; o chamado
        fica disponível para um técnico do novo departamento assumir. Gera um
        evento "Departamento alterado" em `/historico` com o departamento de
        origem e de destino. Falha com 422 se o chamado estiver em status
        final ou se o departamento de destino não existir/estiver inativo.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EncaminharDepartamentoRequest' }
      responses:
        '200':
          description: Chamado encaminhado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Chamado' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /chamados/{id}/devolver-helpdesk:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    post:
      tags: [Chamados]
      summary: Devolve o chamado ao HelpDesk para nova triagem
      description: >
        Administrador ou Técnico pertencente ao departamento responsável
        atual do chamado pode devolvê-lo ao HelpDesk (ex.: encaminhamento
        anterior incorreto). Define o status como "Novo", remove o técnico
        responsável atual (se houver) e atualiza o departamento responsável
        para HelpDesk. Gera um evento "Devolvido ao HelpDesk" em
        `/historico`. Falha com 422 se o chamado já estiver no HelpDesk ou
        estiver em status final.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DevolverHelpDeskRequest' }
      responses:
        '200':
          description: Chamado devolvido ao HelpDesk
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Chamado' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /chamados/{id}/fechar-cliente:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    post:
      tags: [Chamados]
      summary: Cliente fecha o próprio chamado
      description: >
        Só o Cliente solicitante pode fechar o próprio chamado diretamente,
        sem depender de um Técnico/Administrador mudar o status. Preenche
        `fechadoEm` e, se ainda não preenchido, `resolvidoEm`. Falha com 422
        se o chamado já estiver fechado. Notifica os administradores e o
        técnico atribuído (se houver).
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FecharClienteRequest' }
      responses:
        '200':
          description: Chamado fechado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Chamado' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /chamados/{id}/prazo-resolucao:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    patch:
      tags: [Chamados]
      summary: Ajusta manualmente o prazo de resolução do chamado (Técnico atribuído/Administrador)
      description: >
        Sobrescreve o `prazoResolucao` calculado automaticamente a partir do
        SLA da prioridade — na prática, prazos rígidos nem sempre refletem a
        realidade do atendimento. Exige justificativa e gera um evento em
        `/historico`; falha com 422 se o chamado estiver em status final.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrazoResolucaoUpdateRequest' }
      responses:
        '200':
          description: Prazo de resolução ajustado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Chamado' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /chamados/{id}/prazo-resposta:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    patch:
      tags: [Chamados]
      summary: Ajusta manualmente o prazo de resposta do chamado (Técnico atribuído/Administrador)
      description: >
        Sobrescreve o `prazoResposta` calculado automaticamente a partir do
        SLA da prioridade. Diferente do ajuste de prazo de resolução, não
        exige justificativa; gera um evento em `/historico`; falha com 422
        se o chamado estiver em status final.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrazoRespostaUpdateRequest' }
      responses:
        '200':
          description: Prazo de resposta ajustado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Chamado' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /chamados/{id}/avaliacoes:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    get:
      tags: [Chamados]
      summary: Lista as avaliações do chamado
      description: >
        Um chamado pode acumular mais de uma avaliação ao longo do tempo: cada
        ciclo de resolução (reabrir e resolver de novo) libera uma nova
        avaliação, que se empilha sobre as anteriores — a lista vem ordenada
        da mais recente para a mais antiga. Visibilidade por item, por perfil:
        Administrador sempre vê todas; Cliente só vê as que ele mesmo
        registrou; Técnico só vê as públicas (`publica=true`) e não ocultadas
        (`oculta=false`).
      responses:
        '200':
          description: Lista de avaliações (pode ser vazia)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Avaliacao' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /chamados/{id}/avaliacao:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    post:
      tags: [Chamados]
      summary: Registra uma avaliação do chamado
      description: >
        Só o Cliente solicitante pode avaliar, e apenas um chamado no status
        "Resolvido". Uma avaliação por ciclo de resolução (409 se o ciclo
        atual — desde o `resolvidoEm` mais recente — já tiver sido avaliado);
        reabrir e resolver de novo libera uma nova avaliação. Se `publica=true`,
        o técnico atribuído também é notificado; os administradores são
        sempre notificados.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvaliacaoCreateRequest' }
      responses:
        '201':
          description: Avaliação registrada
          headers:
            Location:
              description: URI de `GET /chamados/{id}/avaliacoes`
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Avaliacao' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /chamados/{id}/avaliacoes/{avaliacaoId}:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
      - name: avaliacaoId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      tags: [Chamados]
      summary: Edita a própria avaliação (nota, comentário, visibilidade)
      description: >
        Só o Cliente autor da avaliação pode editá-la — nem Administrador
        edita o conteúdo escrito por outro usuário (só oculta, ver endpoint
        `/ocultar`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvaliacaoUpdateRequest' }
      responses:
        '200':
          description: Avaliação atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Avaliacao' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    delete:
      tags: [Chamados]
      summary: Remove a própria avaliação
      description: Só o Cliente autor da avaliação pode apagá-la. Gera um evento em `/historico`.
      responses:
        '204': { description: Avaliação removida }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /chamados/{id}/avaliacoes/{avaliacaoId}/ocultar:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
      - name: avaliacaoId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      tags: [Chamados]
      summary: Oculta ou reexibe uma avaliação pública (Administrador)
      description: >
        Só se aplica a avaliações públicas (`publica=true`) — uma avaliação
        "só para administradores" já não é visível ao técnico, então ocultar
        não teria efeito (422 nesse caso).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvaliacaoOcultarRequest' }
      responses:
        '200':
          description: Avaliação atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Avaliacao' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  # ---------------------------------------------------------------- Comentários
  /chamados/{id}/comentarios:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    get:
      tags: [Comentários]
      summary: Lista comentários do chamado
      description: Comentários internos (interno=true) só são retornados para Técnico/Administrador.
      responses:
        '200':
          description: Lista de comentários
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Comentario' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Comentários]
      summary: Adiciona um comentário ao chamado (com anexos opcionais)
      description: >
        `multipart/form-data`, não JSON — permite anexar um ou mais arquivos
        junto do próprio comentário (além de `POST /chamados/{id}/anexos`,
        que anexa sem vincular a um comentário). Nomes de campo exatamente
        como no schema (`Mensagem`, `Interno`, `Arquivos`), com a mesma
        capitalização usada pelo model binding do ASP.NET Core. Se for o
        primeiro comentário de um Técnico/Administrador no chamado, satisfaz o
        SLA de resposta (`primeiraRespostaEm`).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [Mensagem]
              properties:
                Mensagem:
                  type: string
                Interno:
                  type: boolean
                  default: false
                  description: Nota interna, visível apenas a Técnico/Administrador. Forçado para false se enviado por um Cliente.
                Arquivos:
                  type: array
                  items: { type: string, format: binary }
      responses:
        '201':
          description: Comentário criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comentario' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Algum arquivo anexado é inválido (tipo não permitido ou tamanho excedido)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /chamados/{id}/comentarios/{comentarioId}:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
      - name: comentarioId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      tags: [Comentários]
      summary: Edita a mensagem do próprio comentário
      description: >
        Só o autor original pode editar, sem janela de tempo — Administrador
        não edita conteúdo de terceiros (só oculta, ver endpoint `/ocultar`).
        Marca `editado=true` na resposta.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ComentarioUpdateRequest' }
      responses:
        '200':
          description: Comentário atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comentario' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /chamados/{id}/comentarios/{comentarioId}/ocultar:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
      - name: comentarioId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      tags: [Comentários]
      summary: Oculta ou reexibe um comentário de qualquer autor (Administrador)
      description: Moderação de conteúdo — marca `oculta` sem apagar a mensagem.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ComentarioOcultarRequest' }
      responses:
        '200':
          description: Comentário atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comentario' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Anexos
  /chamados/{id}/anexos:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    get:
      tags: [Anexos]
      summary: Lista anexos do chamado (metadados)
      responses:
        '200':
          description: Lista de anexos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Anexo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Anexos]
      summary: Envia um arquivo para o chamado
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [arquivo]
              properties:
                arquivo:
                  type: string
                  format: binary
      responses:
        '201':
          description: Anexo criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Anexo' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Arquivo inválido (tipo não permitido ou tamanho excedido)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /chamados/{id}/anexos/{anexoId}:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
      - name: anexoId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      tags: [Anexos]
      summary: Substitui o arquivo de um anexo existente
      description: >
        Mantém o mesmo registro (mesmo `id`) — não cria um novo anexo; o
        arquivo antigo é removido do armazenamento. Só o autor original do
        upload ou um Administrador pode substituir. Marca `editado=true`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [arquivo]
              properties:
                arquivo:
                  type: string
                  format: binary
      responses:
        '200':
          description: Anexo atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Anexo' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Arquivo inválido (tipo não permitido ou tamanho excedido)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /chamados/{id}/anexos/{anexoId}/download:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
      - name: anexoId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Anexos]
      summary: Baixa o conteúdo binário do anexo
      responses:
        '200':
          description: Conteúdo do arquivo
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Histórico
  /chamados/{id}/historico:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    get:
      tags: [Histórico]
      summary: Lista o histórico (trilha de auditoria) do chamado
      responses:
        '200':
          description: Lista de eventos de histórico (ordem cronológica)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Historico' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Usuários (admin)
  /usuarios:
    get:
      tags: [Usuários]
      summary: Lista usuários (Administrador)
      description: Sem paginação — retorna todos os usuários cadastrados (ativos e inativos).
      responses:
        '200':
          description: Lista de usuários
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Usuario' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Usuários]
      summary: Cria um usuário com perfil Técnico ou Administrador (Administrador)
      description: >
        Diferente de `/auth/registrar` (sempre Cliente), este endpoint só
        aceita `perfil` igual a `TECNICO` ou `ADMINISTRADOR`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UsuarioCreate' }
      responses:
        '201':
          description: Usuário criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /usuarios/{id}/ativo:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    patch:
      tags: [Usuários]
      summary: Ativa ou desativa um usuário (Administrador)
      description: >
        Um Administrador não pode desativar a própria conta (422). Desativar
        derruba imediatamente qualquer sessão em tempo real do usuário
        (evento `ContaDesativada` no hub SignalR) e invalida o JWT dele na
        próxima requisição/reconexão (`OnTokenValidated`, ver
        `backend/README.md`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UsuarioAtivoRequest' }
      responses:
        '200':
          description: Usuário atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /usuarios/{id}/senha:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    patch:
      tags: [Usuários]
      summary: Redefine a senha de um usuário (Administrador)
      description: Não exige a senha atual — distinto de `/usuarios/me/senha` (autoatendimento).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UsuarioSenhaRequest' }
      responses:
        '200':
          description: Usuário atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /usuarios/me:
    patch:
      tags: [Usuários]
      summary: Autoatendimento — edita o próprio nome/e-mail
      description: Qualquer usuário autenticado (Administrador, Técnico ou Cliente), sem exigir papel algum.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeuPerfilUpdateRequest' }
      responses:
        '200':
          description: Usuário atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /usuarios/me/senha:
    patch:
      tags: [Usuários]
      summary: Autoatendimento — troca a própria senha
      description: >
        Diferente de `/usuarios/{id}/senha` (Administrador trocando a senha de
        terceiros), aqui a senha atual é exigida e verificada.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlterarMinhaSenhaRequest' }
      responses:
        '204': { description: Senha alterada }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /usuarios/{id}/departamentos:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    put:
      tags: [Usuários]
      summary: Substitui os departamentos de um usuário (Administrador)
      description: >
        Substitui integralmente o vínculo N:N do usuário com departamentos
        (não é incremental — os `idsDepartamentos` enviados passam a ser a
        lista completa). Falha com 422 se algum id não corresponder a um
        departamento existente.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UsuarioDepartamentosRequest' }
      responses:
        '200':
          description: Usuário com departamentos atualizados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  # ---------------------------------------------------------------- Departamentos (admin)
  /departamentos:
    get:
      tags: [Departamentos]
      summary: Lista departamentos
      parameters:
        - name: apenasAtivos
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Lista de departamentos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Departamento' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Departamentos]
      summary: Cria um departamento (Administrador)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepartamentoCreate' }
      responses:
        '201':
          description: Departamento criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Departamento' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /departamentos/{id}:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    patch:
      tags: [Departamentos]
      summary: Atualiza nome/descrição de um departamento (Administrador)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepartamentoUpdate' }
      responses:
        '200':
          description: Departamento atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Departamento' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /departamentos/{id}/status:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    patch:
      tags: [Departamentos]
      summary: Ativa ou inativa um departamento (Administrador)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepartamentoStatusRequest' }
      responses:
        '200':
          description: Departamento com status atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Departamento' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Domínios (admin)
  /categorias:
    get:
      tags: [Domínios]
      summary: Lista categorias ativas
      responses:
        '200':
          description: Lista de categorias
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Categoria' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Domínios]
      summary: Cria categoria (Administrador)
      description: >
        Não há endpoints de atualização/remoção de categoria — o cadastro é
        somente-criação neste MVP.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoriaInput' }
      responses:
        '201':
          description: Categoria criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Categoria' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /prioridades:
    get:
      tags: [Domínios]
      summary: Lista prioridades
      description: >
        Somente-leitura — prioridades (Baixa/Média/Alta/Urgente, conforme o
        seed) não têm endpoint de criação; são pré-configuradas junto com o
        SLA de cada uma em `/slas`.
      responses:
        '200':
          description: Lista de prioridades
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Prioridade' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /status:
    get:
      tags: [Domínios]
      summary: Lista status
      responses:
        '200':
          description: Lista de status
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Status' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /slas:
    get:
      tags: [Domínios]
      summary: Lista as configurações de SLA
      responses:
        '200':
          description: Lista de SLAs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Sla' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Domínios]
      summary: Cria ou atualiza o SLA de uma prioridade (Administrador)
      description: >
        Upsert por `idPrioridade`: se já existir um SLA para a prioridade,
        atualiza-o (200); caso contrário, cria um novo (201).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SlaInput' }
      responses:
        '200':
          description: SLA atualizado (já existia um para a prioridade)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sla' }
        '201':
          description: SLA criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sla' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  # ---------------------------------------------------------------- Notificações
  /notificacoes:
    get:
      tags: [Notificações]
      summary: Lista notificações do usuário autenticado
      description: >
        Retorna as notificações mais recentes (até 50) destinadas ao usuário
        autenticado — geradas automaticamente pelo monitoramento de SLA
        (chamados em risco ou vencidos), destinadas ao técnico atribuído e a
        todos os Administradores ativos.
      parameters:
        - name: apenasNaoLidas
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Lista de notificações
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Notificacao' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /notificacoes/nao-lidas/contagem:
    get:
      tags: [Notificações]
      summary: Contagem de notificações não lidas do usuário autenticado
      description: Usado para o indicador (badge) do sino de notificações.
      responses:
        '200':
          description: Contagem de não lidas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificacaoContagem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /notificacoes/{id}/lida:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    patch:
      tags: [Notificações]
      summary: Marca uma notificação como lida
      responses:
        '204':
          description: Notificação marcada como lida
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /notificacoes/lidas:
    patch:
      tags: [Notificações]
      summary: Marca todas as notificações do usuário autenticado como lidas
      responses:
        '204':
          description: Notificações marcadas como lidas
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------------- Métricas
  /metricas/chamados-por-status:
    get:
      tags: [Métricas]
      summary: Distribuição de chamados por status
      description: >
        Conta todos os chamados (abertos ou finalizados) agrupados por
        status — diferente de `GET /chamados/resumo-sla`, que só olha
        chamados em aberto. Alimenta o gráfico do dashboard. Escopo por
        departamento igual a `GET /chamados`: Administrador e Técnico do
        HelpDesk veem todos; Técnico de outro departamento só vê os chamados
        do(s) departamento(s) a que pertence. Somente Administrador/Técnico
        podem chamar.
      parameters:
        - name: dataInicio
          in: query
          description: Filtra chamados criados a partir desta data/hora (inclusive)
          schema: { type: string, format: date-time }
        - name: dataFim
          in: query
          description: Filtra chamados criados até esta data/hora (inclusive)
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Quantidade de chamados por status
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChamadoPorStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /metricas/produtividade-tecnicos:
    get:
      tags: [Métricas]
      summary: Produtividade por técnico
      description: >
        Para cada técnico ativo (do escopo do chamador — ver acima), quantos
        chamados foram atribuídos e resolvidos no período, e o tempo médio de
        resolução em horas (`null` se nenhum foi resolvido no período). Um
        Técnico (não Administrador) só enxerga a própria linha — produtividade
        entre colegas é considerada dado sensível.
      parameters:
        - name: dataInicio
          in: query
          schema: { type: string, format: date-time }
        - name: dataFim
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Produtividade por técnico
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProdutividadeTecnico' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Page:
      name: page
      in: query
      description: Número da página (base 1)
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      description: Itens por página
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Sort:
      name: sort
      in: query
      description: 'Campo de ordenação, prefixo "-" para descendente. Ex.: -criadoEm'
      schema: { type: string }

  responses:
    BadRequest:
      description: Requisição malformada
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Não autenticado (token ausente/inválido)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Autenticado, mas sem permissão para o recurso
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: 'Conflito (ex.: e-mail já existe, transição de status inválida)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UnprocessableEntity:
      description: Falha de validação dos campos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    # ----- Comuns -----
    ErrorResponse:
      type: object
      description: Formato padronizado de erro para toda a API.
      required: [status, title]
      properties:
        status: { type: integer, example: 422 }
        title: { type: string, example: 'Falha de validação' }
        detail: { type: string, example: 'Um ou mais campos são inválidos.' }
        traceId: { type: string, example: '00-abc123...' }
        errors:
          type: object
          description: Mapa campo → lista de mensagens (para 422)
          additionalProperties:
            type: array
            items: { type: string }
      examples:
        - status: 422
          title: 'Falha de validação'
          errors:
            titulo: ['O título é obrigatório.']
    PageMeta:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page: { type: integer, example: 1 }
        pageSize: { type: integer, example: 20 }
        totalItems: { type: integer, example: 137 }
        totalPages: { type: integer, example: 7 }

    # ----- Auth -----
    LoginRequest:
      type: object
      required: [email, senha]
      properties:
        email: { type: string, format: email }
        senha: { type: string, format: password, minLength: 6 }
    RegistrarClienteRequest:
      type: object
      required: [nome, email, senha]
      properties:
        nome: { type: string }
        email: { type: string, format: email }
        senha: { type: string, format: password, minLength: 6 }
    AuthResponse:
      type: object
      required: [accessToken, refreshToken, expiresIn, usuario]
      properties:
        accessToken: { type: string }
        refreshToken:
          type: string
          description: >
            Emitido junto do access token, mas ainda sem um endpoint
            `/auth/refresh` para trocá-lo por um novo par — reservado para uso futuro.
        expiresIn: { type: integer, description: Segundos até expirar, example: 3600 }
        usuario: { $ref: '#/components/schemas/Usuario' }

    # ----- Perfil / Usuário -----
    Perfil:
      type: string
      description: Papel de acesso do usuário
      enum: [ADMINISTRADOR, TECNICO, CLIENTE]
    Usuario:
      type: object
      properties:
        id: { type: integer, format: int64 }
        nome: { type: string }
        email: { type: string, format: email }
        perfil: { $ref: '#/components/schemas/Perfil' }
        ativo: { type: boolean }
        criadoEm: { type: string, format: date-time }
        departamentos:
          type: array
          items: { $ref: '#/components/schemas/Departamento' }
          description: Departamentos aos quais o usuário pertence (relevante para perfil Técnico)
    UsuarioCreate:
      type: object
      required: [nome, email, senha, perfil]
      description: >
        Usado só por `POST /usuarios` (Administrador). `perfil` aceita apenas
        `TECNICO` ou `ADMINISTRADOR` aqui — um Cliente só se cadastra via
        `POST /auth/registrar`.
      properties:
        nome: { type: string, maxLength: 120 }
        email: { type: string, format: email, maxLength: 160 }
        senha: { type: string, format: password, minLength: 6 }
        perfil: { $ref: '#/components/schemas/Perfil' }
    UsuarioAtivoRequest:
      type: object
      required: [ativo]
      properties:
        ativo: { type: boolean }
    UsuarioSenhaRequest:
      type: object
      required: [novaSenha]
      properties:
        novaSenha: { type: string, format: password, minLength: 6 }
    MeuPerfilUpdateRequest:
      type: object
      required: [nome, email]
      properties:
        nome: { type: string }
        email: { type: string, format: email }
    AlterarMinhaSenhaRequest:
      type: object
      required: [senhaAtual, novaSenha]
      properties:
        senhaAtual: { type: string, format: password }
        novaSenha: { type: string, format: password, minLength: 6 }
    UsuarioDepartamentosRequest:
      type: object
      required: [idsDepartamentos]
      properties:
        idsDepartamentos:
          type: array
          items: { type: integer, format: int64 }

    # ----- Departamentos -----
    Departamento:
      type: object
      properties:
        id: { type: integer, format: int64 }
        nome: { type: string }
        descricao: { type: string }
        ativo: { type: boolean }
        criadoEm: { type: string, format: date-time }
    DepartamentoCreate:
      type: object
      required: [nome]
      properties:
        nome: { type: string, maxLength: 80 }
        descricao: { type: string, maxLength: 255 }
    DepartamentoUpdate:
      type: object
      properties:
        nome: { type: string, maxLength: 80 }
        descricao: { type: string, maxLength: 255 }
    DepartamentoStatusRequest:
      type: object
      required: [ativo]
      properties:
        ativo: { type: boolean }

    # ----- Domínios -----
    Status:
      type: object
      description: >
        Estado do chamado. Registros predefinidos, em ordem: "Novo" (aberto
        pelo cliente, ainda em triagem no HelpDesk), "Aberto" (departamento
        responsável já definido), "Em Atendimento", "Aguardando Cliente",
        "Resolvido", "Fechado".
      properties:
        id: { type: integer, format: int64 }
        nome: { type: string }
        ordem: { type: integer }
        final: { type: boolean }
    Categoria:
      type: object
      properties:
        id: { type: integer, format: int64 }
        nome: { type: string }
        descricao: { type: string }
        ativa: { type: boolean }
    CategoriaInput:
      type: object
      required: [nome]
      description: Usado só por `POST /categorias` — não há atualização/remoção.
      properties:
        nome: { type: string, maxLength: 80 }
        descricao: { type: string, maxLength: 255 }
        ativa: { type: boolean, default: true }
    Prioridade:
      type: object
      properties:
        id: { type: integer, format: int64 }
        nome: { type: string }
        nivel: { type: integer }
    Sla:
      type: object
      properties:
        id: { type: integer, format: int64 }
        idPrioridade: { type: integer, format: int64 }
        tempoRespostaMin: { type: integer, description: Minutos para 1ª resposta }
        tempoResolucaoMin: { type: integer, description: Minutos para resolução }
        ativo: { type: boolean }
    SlaInput:
      type: object
      required: [idPrioridade, tempoRespostaMin, tempoResolucaoMin]
      properties:
        idPrioridade: { type: integer, format: int64 }
        tempoRespostaMin: { type: integer, minimum: 1 }
        tempoResolucaoMin: { type: integer, minimum: 1 }
        ativo: { type: boolean, default: true }
    SituacaoSla:
      type: string
      description: >
        Situação do chamado em relação ao prazo de SLA, recalculada
        periodicamente pelo monitoramento de SLA. "EmRisco" a partir de 80%
        do tempo decorrido até o prazo; "Vencido" quando o prazo é ultrapassado.
      enum: [EmDia, EmRisco, Vencido]

    # ----- Chamado -----
    Chamado:
      type: object
      properties:
        id: { type: integer, format: int64 }
        titulo: { type: string }
        descricao: { type: string }
        solicitante: { $ref: '#/components/schemas/Usuario' }
        tecnico:
          oneOf:
            - { $ref: '#/components/schemas/Usuario' }
            - { type: 'null' }
        status: { $ref: '#/components/schemas/Status' }
        categoria: { $ref: '#/components/schemas/Categoria' }
        prioridade: { $ref: '#/components/schemas/Prioridade' }
        departamento:
          allOf:
            - { $ref: '#/components/schemas/Departamento' }
          description: >
            Departamento responsável atual pelo atendimento. Todo chamado
            nasce no HelpDesk (status "Novo") e passa a apontar para o
            departamento definido em `/encaminhar` quando triado.
        criadoEm: { type: string, format: date-time }
        atualizadoEm: { type: string, format: date-time }
        prazoResposta: { type: string, format: date-time, nullable: true }
        prazoResolucao: { type: string, format: date-time, nullable: true }
        primeiraRespostaEm:
          type: string
          format: date-time
          nullable: true
          description: >
            Timestamp do primeiro comentário de um Técnico/Administrador no
            chamado. A partir daí o SLA de resposta é considerado satisfeito
            e sua situação fica congelada (o monitoramento periódico para de
            reavaliá-la).
        resolvidoEm: { type: string, format: date-time, nullable: true }
        fechadoEm: { type: string, format: date-time, nullable: true }
        situacaoSlaResposta: { $ref: '#/components/schemas/SituacaoSla' }
        situacaoSlaResolucao: { $ref: '#/components/schemas/SituacaoSla' }
        conteudoEditado:
          type: boolean
          description: true se título e/ou descrição já foram editados via `PATCH /chamados/{id}/conteudo`.
        descricaoOculta:
          type: boolean
          description: true se a descrição original foi ocultada por um Administrador (moderação).
    ChamadoCreate:
      type: object
      required: [titulo, descricao]
      description: >
        idCategoria/idPrioridade são obrigatórios para Técnico/Administrador,
        mas ignorados para Cliente: o servidor sempre aplica os defaults de
        triagem (categoria "A Triar", prioridade "Média") nesse caso, mesmo
        que os campos sejam enviados no corpo. Todo chamado é criado com
        status "Novo" e departamento HelpDesk, independentemente do perfil de
        quem abre — não há campo para escolher status/departamento na criação.
      properties:
        titulo: { type: string, maxLength: 160 }
        descricao: { type: string }
        idCategoria: { type: integer, format: int64 }
        idPrioridade: { type: integer, format: int64 }
    ChamadoUpdate:
      type: object
      description: Campos opcionais; apenas os enviados são alterados.
      properties:
        idStatus: { type: integer, format: int64 }
        idCategoria: { type: integer, format: int64 }
        idPrioridade: { type: integer, format: int64 }
    ChamadoConteudoUpdateRequest:
      type: object
      description: Campos opcionais; apenas os enviados (não vazios) são alterados.
      properties:
        titulo: { type: string, maxLength: 160 }
        descricao: { type: string }
    ChamadoOcultarDescricaoRequest:
      type: object
      required: [oculta]
      properties:
        oculta: { type: boolean }
    AtribuirTecnicoRequest:
      type: object
      required: [idTecnico]
      properties:
        idTecnico: { type: integer, format: int64 }
    EncaminharDepartamentoRequest:
      type: object
      required: [idDepartamento]
      properties:
        idDepartamento: { type: integer, format: int64 }
    DevolverHelpDeskRequest:
      type: object
      required: [justificativa]
      properties:
        justificativa: { type: string, minLength: 1 }
    PrazoResolucaoUpdateRequest:
      type: object
      required: [prazoResolucao, justificativa]
      properties:
        prazoResolucao: { type: string, format: date-time }
        justificativa: { type: string, minLength: 1 }
    PrazoRespostaUpdateRequest:
      type: object
      required: [prazoResposta]
      properties:
        prazoResposta: { type: string, format: date-time }
    FecharClienteRequest:
      type: object
      properties:
        motivo: { type: string }
    ChamadoPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Chamado' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    # ----- Comentário / Anexo / Histórico -----
    # Não há um schema "ComentarioCreate": o corpo de POST /chamados/{id}/comentarios
    # é multipart/form-data (mensagem + anexos), descrito inline no path.
    Comentario:
      type: object
      properties:
        id: { type: integer, format: int64 }
        idChamado: { type: integer, format: int64 }
        autor: { $ref: '#/components/schemas/Usuario' }
        mensagem: { type: string }
        interno: { type: boolean }
        criadoEm: { type: string, format: date-time }
        editado: { type: boolean, description: 'true se editado via PATCH /chamados/{id}/comentarios/{comentarioId}.' }
        oculta: { type: boolean, description: 'true se ocultado por um Administrador (moderação).' }
        anexos:
          type: array
          items: { $ref: '#/components/schemas/Anexo' }
          description: Anexos enviados junto deste comentário (via multipart, campo Arquivos).
    ComentarioUpdateRequest:
      type: object
      required: [mensagem]
      properties:
        mensagem: { type: string }
    ComentarioOcultarRequest:
      type: object
      required: [oculta]
      properties:
        oculta: { type: boolean }
    Anexo:
      type: object
      properties:
        id: { type: integer, format: int64 }
        idChamado: { type: integer, format: int64 }
        idComentario:
          type: integer
          format: int64
          nullable: true
          description: Preenchido quando o anexo foi enviado junto de um comentário (`POST /chamados/{id}/comentarios`).
        autor: { $ref: '#/components/schemas/Usuario' }
        nomeArquivo: { type: string }
        tipoMime: { type: string }
        tamanhoBytes: { type: integer, format: int64 }
        url: { type: string, description: URL para download do anexo }
        criadoEm: { type: string, format: date-time }
        editado: { type: boolean, description: 'true se o arquivo já foi substituído via PUT /chamados/{id}/anexos/{anexoId}.' }
    Historico:
      type: object
      properties:
        id: { type: integer, format: int64 }
        idChamado: { type: integer, format: int64 }
        autor: { $ref: '#/components/schemas/Usuario' }
        statusAnterior:
          oneOf:
            - { $ref: '#/components/schemas/Status' }
            - { type: 'null' }
        statusNovo:
          oneOf:
            - { $ref: '#/components/schemas/Status' }
            - { type: 'null' }
        departamentoAnterior:
          oneOf:
            - { $ref: '#/components/schemas/Departamento' }
            - { type: 'null' }
          description: Preenchido apenas em eventos de encaminhamento entre departamentos
        departamentoNovo:
          oneOf:
            - { $ref: '#/components/schemas/Departamento' }
            - { type: 'null' }
          description: Preenchido apenas em eventos de encaminhamento entre departamentos
        acao: { type: string, example: 'Mudança de status' }
        detalhe: { type: string }
        criadoEm: { type: string, format: date-time }

    # ----- Avaliação -----
    Avaliacao:
      type: object
      description: >
        Um chamado pode ter mais de uma (uma por ciclo de resolução) — ver
        `GET /chamados/{id}/avaliacoes`.
      properties:
        id: { type: integer, format: int64 }
        idChamado: { type: integer, format: int64 }
        autor: { $ref: '#/components/schemas/Usuario' }
        nota: { type: integer, minimum: 0, maximum: 5 }
        comentario: { type: string }
        publica:
          type: boolean
          description: Quando true, a avaliação também é visível ao técnico atribuído (se não estiver oculta)
        oculta:
          type: boolean
          description: 'true se um Administrador ocultou esta avaliação pública (PATCH .../ocultar). Só se aplica a avaliações públicas.'
        editado:
          type: boolean
          description: 'true se o autor já editou nota/comentário/visibilidade via PATCH /chamados/{id}/avaliacoes/{avaliacaoId}.'
        criadoEm: { type: string, format: date-time }
    AvaliacaoCreateRequest:
      type: object
      required: [nota]
      properties:
        nota: { type: integer, minimum: 0, maximum: 5 }
        comentario: { type: string }
        publica:
          type: boolean
          default: false
          description: Quando true, o técnico atribuído também é notificado da avaliação
    AvaliacaoUpdateRequest:
      type: object
      required: [nota]
      properties:
        nota: { type: integer, minimum: 0, maximum: 5 }
        comentario: { type: string }
        publica: { type: boolean, default: false }
    AvaliacaoOcultarRequest:
      type: object
      required: [oculta]
      properties:
        oculta: { type: boolean }

    # ----- Notificações -----
    TipoNotificacao:
      type: string
      description: >
        Origem da notificação: "SlaEmRisco"/"SlaVencido" vêm do monitoramento
        periódico de SLA (80% do tempo decorrido / prazo ultrapassado);
        "PrazoAjustado" é gerada para os administradores quando um Técnico
        ajusta manualmente o prazo de resposta ou resolução de um chamado;
        "ChamadoReaberto" é gerada para os administradores e o técnico
        atribuído quando um chamado finalizado é reaberto; "FechadoPorCliente"
        é gerada para os administradores e o técnico atribuído quando o
        Cliente fecha o próprio chamado; "NovaAvaliacao" é gerada para os
        administradores (sempre) e para o técnico atribuído (só se a
        avaliação for pública) quando um chamado é avaliado; "NovoComentario"
        é gerada para o solicitante (se o comentário não for interno) e para
        o técnico atribuído; "MudancaStatus" é gerada em mudanças de status e
        em encaminhamento/devolução entre departamentos; "TecnicoAtribuido" é
        gerada quando um chamado é atribuído ou assumido por um técnico.
      enum:
        [
          SlaEmRisco,
          SlaVencido,
          PrazoAjustado,
          ChamadoReaberto,
          FechadoPorCliente,
          NovaAvaliacao,
          NovoComentario,
          MudancaStatus,
          TecnicoAtribuido,
        ]
    Notificacao:
      type: object
      properties:
        id: { type: integer, format: int64 }
        idChamado: { type: integer, format: int64 }
        tipo: { $ref: '#/components/schemas/TipoNotificacao' }
        mensagem: { type: string }
        lida: { type: boolean }
        criadoEm: { type: string, format: date-time }
    NotificacaoContagem:
      type: object
      properties:
        naoLidas: { type: integer }
    ResumoSla:
      type: object
      properties:
        emRisco: { type: integer, description: Chamados abertos com SLA de resposta ou resolução em risco }
        vencidos: { type: integer, description: Chamados abertos com SLA de resposta ou resolução vencido }

    # ----- Métricas -----
    ChamadoPorStatus:
      type: object
      properties:
        statusId: { type: integer, format: int64 }
        statusNome: { type: string }
        quantidade: { type: integer, description: Total de chamados (abertos ou finalizados) neste status, no período filtrado }
    ProdutividadeTecnico:
      type: object
      properties:
        tecnicoId: { type: integer, format: int64 }
        tecnicoNome: { type: string }
